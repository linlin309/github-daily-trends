name: llm-probe

# 手动触发的 LLM 连通性探针：不跑采集、不碰 GitHub API、不发邮件。
# 用途：AI 分析失败时，几秒钟内定位是鉴权 / 模型名 / 限流 / 超时哪一类问题。
on:
  workflow_dispatch:
    inputs:
      full:
        description: '用真实提示词 + 真实项目跑完整分析（更耗 token，但能测出真实耗时）'
        required: false
        default: false
        type: boolean
      count:
        description: '--full 模式下提交的项目数'
        required: false
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
      MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
      MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ vars.MAIL_TO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 最小请求（鉴权 / base_url / 模型名 / 额度）
        if: ${{ inputs.full != true }}
        run: python scripts/check_llm.py --verbose

      - name: 完整分析（真实提示词与项目数据）
        if: ${{ inputs.full == true }}
        run: python scripts/check_llm.py --full --count "${{ inputs.count }}" --verbose
