name: daily-report

# 自动运行时间见下方 schedule；也支持手动触发（补跑 / 重发 / dry-run）
on:
  schedule:
    # 10:07（北京时间）= 02:07 UTC。
    # 用 7 分而不是 0 分：整点是 GitHub 调度最拥堵的时刻，容易被延迟或丢弃。
    # 注意：GitHub Actions 的 schedule 只支持标准 cron，按 UTC 计算，
    # 官方文档（events-that-trigger-workflows）里没有 timezone 字段，写了也不会生效。
    # 报告日期由代码用 ZoneInfo("Asia/Shanghai") 推导，不受此处时区影响。
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 YYYY-MM-DD（留空 = 按 Asia/Shanghai 当天）'
        required: false
        type: string
      force:
        description: '强制重发邮件（当天已发送过时使用）'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '只生成到 preview/ 并打印预览（不发邮件、不提交）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # 仅为提交 reports/，最小权限

concurrency:
  group: daily-report
  cancel-in-progress: false  # 两次运行串行，避免交叉写文件

jobs:
  # 先跑单元测试：解析器或规则改坏了就不生成日报
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  report:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      # 同厂商备用模型（复用 LLM_API_KEY）。漏了这一行，config 会把该 provider
      # 当成"变量未提供"直接丢弃，1305 过载时就没有第二条腿可换。
      LLM_MODEL_2: ${{ vars.LLM_MODEL_2 }}
      LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
      MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST }}
      MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ vars.MAIL_TO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: 计算报告日期（Asia/Shanghai）
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.date }}" ]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi
          echo "报告日期：$(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: 幂等检查（当天是否已发过邮件）
        id: idem
        run: |
          set -euo pipefail
          # 判据是"邮件是否真的发成功过"（JSON 里的 email.ok），不是"报告文件是否存在"：
          # 报告可能被凌晨误触或手动补跑先生成，只看文件会让当天永久漏发。
          if python -c "import sys;sys.exit(0 if __import__('json').load(open('reports/${{ steps.meta.outputs.date }}.json',encoding='utf-8')).get('email',{}).get('ok') else 1)" 2>/dev/null; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "当天邮件已发过：跳过重复发送（除非 force=true）"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成报告（先落盘，不发邮件）
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --date "${{ steps.meta.outputs.date }}" --dry-run
          else
            python -m src.main --date "${{ steps.meta.outputs.date }}" --no-email
          fi

      - name: 提交历史（MD + JSON）
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
            exit 0
          fi
          git commit -m "report: ${{ steps.meta.outputs.date }}"
          if ! git push; then
            # 同一天两个运行并行时（外部 cron 与 schedule 撞车、或手动补跑），两者
            # checkout 的是同一个 base，都会生成同名报告文件，直接 rebase 必然冲突。
            # rebase 中的 -X theirs 指"取被应用的提交"，也就是本次运行生成的内容，
            # 与"报告文件按日期覆盖、后写者胜"的既有语义一致。
            echo "push 失败，尝试 rebase 后重试一次（同名报告以本次生成为准）"
            git pull --rebase --autostash -X theirs
            git push
          fi

      - name: 发送邮件（历史已提交之后才执行）
        id: send
        if: ${{ inputs.dry_run != true && (steps.idem.outputs.exists == '0' || inputs.force == true) }}
        run: python -m src.main --send-only --date "${{ steps.meta.outputs.date }}"

      # 发信成功才回写 email.ok，所以要再提交一次，否则下次运行读到旧 JSON 会重复发信。
      - name: 记录发信状态
        if: ${{ inputs.dry_run != true && steps.send.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "发信状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 记录 ${{ steps.meta.outputs.date }} 已发信"
          if ! git push; then
            git pull --rebase --autostash -X theirs
            git push
          fi
