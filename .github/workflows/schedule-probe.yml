name: schedule-probe

# 临时文件：验证 GitHub Actions 的 schedule 触发器在本仓库是否真的会触发。
# 三条纯 UTC 探针，命中任意一条即证明机制可用；验证完成后删除本文件。
on:
  schedule:
    - cron: '44 7 * * *'
    - cron: '54 7 * * *'
    - cron: '4 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报告触发信息
        run: |
          echo "event_name   = ${{ github.event_name }}"
          echo "fired cron   = ${{ github.event.schedule }}"
          echo "UTC now      = $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Beijing now  = $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "actor        = ${{ github.actor }}"
