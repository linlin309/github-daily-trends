name: schedule-probe

# 临时文件：验证 GitHub Actions 的 schedule 触发器在本仓库是否真的会触发。
# 短周期探针（07:44/07:54/08:04 UTC）全部未触发，故留长周期探针排查
# “调度器注册延迟”这一可能：命中任意一条即说明机制可用、只是延迟大。
# 验证完成后删除本文件。
on:
  schedule:
    - cron: '26 9 * * *'
    - cron: '26 10 * * *'
    - cron: '26 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报告触发信息
        run: |
          echo "event_name   = ${{ github.event_name }}"
          echo "fired cron   = ${{ github.event.schedule }}"
          echo "UTC now      = $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Beijing now  = $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "actor        = ${{ github.actor }}"
