name: parser-canary

# 每周一次线上解析自检：GitHub Trending 页面结构一旦变化，当周就能发现，
# 而不是某天悄悄降级成 Search 兜底。
on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_trending.py
